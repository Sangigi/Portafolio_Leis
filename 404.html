<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · Portafolio Leonel Almanza</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <style>
    /* Pantalla de DOS: siempre negra, como el CONTINUE? (mismos colores que css/estilos.css) */
    :root{--p-negro:#030303;--p-blanco:#ECEBE4;--p-amarillo:#FFD319;--p-azul:#3D7BFF;--p-rojo:#FF3D3D;--p-gris:#7C8098;--p-gris-osc:#262a38;
      --gris-claro:#BEBDB5;--negro-claro:#111111;--amarillo-oscuro:#B98B00;
      --f-pixel:"Press Start 2P","Courier New",monospace;--f-term:"VT323",Consolas,"Courier New",monospace}
    [hidden]{display:none!important}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;background:var(--p-negro);color:var(--gris-claro)}
    body{min-height:100vh;min-height:100dvh;display:flex;font-family:var(--f-term);-webkit-font-smoothing:antialiased}
    .err{flex:1;display:flex;flex-direction:column;gap:18px;width:100%;max-width:980px;margin:0 auto;padding:max(40px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));
      font-size:24px;line-height:1.3;text-shadow:0 0 .3em color-mix(in srgb,currentColor 28%,transparent)}
    .err-txt{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
    .err-txt .b{color:var(--p-blanco)}
    .err-txt .r{color:var(--p-rojo)}
    .err-txt .y{color:var(--p-amarillo)}
    .err-txt .g{color:var(--p-gris)}
    .cur{display:inline-block;width:.55em;height:1em;vertical-align:-.12em;background:var(--p-blanco);animation:blink 1s steps(1,end) infinite}
    @keyframes blink{50%{opacity:0}}
    .err-op{display:flex;flex-wrap:wrap;gap:8px 14px}
    .err-op button,.err-bit-op button{padding:10px 14px;border:0;background:none;color:var(--p-amarillo);font-family:var(--f-pixel);font-size:12px;letter-spacing:.06em;cursor:pointer}
    .err-op button u{text-underline-offset:4px;text-decoration-thickness:3px}
    .err-op button:hover,.err-op button:focus-visible,.err-bit-op button:hover,.err-bit-op button:focus-visible{outline:none;background:var(--p-amarillo);color:var(--p-negro)}
    .err-ayuda{margin:0;font-size:19px;color:var(--p-gris)}
    /* BIT a la izquierda y su globo a la derecha; los botones abajo */
    .err-bit{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px 20px}
    .err-bit .spr{animation:brinco .55s steps(6,end)}
    .err-bit .spr svg{display:block}
    .err-bit-say{position:relative;justify-self:start;max-width:440px;margin:0;padding:12px 14px;background:var(--p-gris-osc);color:var(--p-blanco);font-size:22px;line-height:1.2}
    .err-bit-say::after{content:"";position:absolute;left:-10px;top:50%;width:10px;height:8px;margin-top:-4px;background:var(--p-gris-osc)}
    .err-bit-op{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
    @keyframes brinco{0%{transform:scale(1.15,.8)}20%{transform:translateY(-14px) scale(.9,1.15)}45%{transform:translateY(-20px)}70%{transform:translateY(-6px) scale(.95,1.08)}85%{transform:scale(1.18,.78)}100%{transform:none}}
    .pY{fill:var(--p-amarillo)}.pQ{fill:var(--amarillo-oscuro)}.pK{fill:var(--p-negro)}.pW{fill:var(--p-blanco)}
    .err-dir{display:grid;gap:2px;font-size:24px}
    .err-dir a{display:grid;grid-template-columns:14ch auto;width:max-content;max-width:100%;padding:2px 6px;margin-left:-6px;color:var(--p-blanco);text-decoration:none}
    .err-dir a b{font-weight:400}
    .err-dir a span{color:var(--p-gris)}
    .err-dir a:hover,.err-dir a:focus-visible{outline:none;background:var(--p-amarillo);color:var(--p-negro)}
    .err-dir a:hover span,.err-dir a:focus-visible span{color:var(--p-negro)}
    .err-dir p{margin:6px 0 0;color:var(--p-gris)}
    .glitch{animation:sacude .08s steps(2,end) infinite}
    @keyframes sacude{50%{transform:translate(3px,-1px)}}
    /* La pantalla se apaga (Abortar): se cierra en una línea y la línea en un punto */
    #apagado{position:fixed;inset:0;z-index:70}
    #apagado .ap-h{position:absolute;left:0;right:0;height:50.5%;background:var(--p-negro)}
    #apagado .ap-t{top:0;transform:translateY(-100%)}
    #apagado .ap-b{bottom:0;transform:translateY(100%)}
    #apagado .ap-ln{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;opacity:0;background:var(--p-blanco);
      box-shadow:0 0 14px 3px color-mix(in srgb,var(--p-blanco) 60%,transparent),0 0 40px 8px color-mix(in srgb,var(--p-azul) 35%,transparent)}
    #apagado.off .ap-t,#apagado.off .ap-b{animation:cierra .4s steps(5,end) forwards}
    #apagado.off .ap-ln{animation:linea 1.1s steps(11,end) forwards}
    @keyframes cierra{to{transform:none}}
    @keyframes linea{0%,30%{opacity:0;transform:none}36%{opacity:1;transform:scaleY(6)}55%{opacity:1;transform:none}75%{opacity:1;transform:scaleX(.012) scaleY(1.5)}88%{opacity:1;transform:scaleX(.006) scaleY(1.5)}100%{opacity:0;transform:scaleX(0)}}
    /* Filtro CRT */
    .crt{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
    .crt > div{position:absolute;inset:0}
    .crt .scan{background:repeating-linear-gradient(180deg,color-mix(in srgb,#ECEBE4 1.5%,transparent) 0 1px,transparent 1px 2px,color-mix(in srgb,#030303 40%,transparent) 2px 3px)}
    .crt .roll{inset:0 0 auto 0;height:28vh;background:linear-gradient(180deg,transparent,color-mix(in srgb,#ECEBE4 1.5%,transparent) 45%,color-mix(in srgb,#ECEBE4 2.5%,transparent) 50%,color-mix(in srgb,#ECEBE4 1.5%,transparent) 55%,transparent);animation:roll 8s linear infinite}
    @keyframes roll{from{transform:translateY(-30vh)}to{transform:translateY(105vh)}}
    .crt .vig{background:radial-gradient(ellipse 88% 78% at 50% 50%,transparent 58%,color-mix(in srgb,#030303 50%,transparent) 84%,color-mix(in srgb,#030303 88%,transparent) 100%)}
    @media (max-width:600px){
      .err{font-size:21px;padding-top:28px}
      .err-bit{gap:12px 14px}
      .err-bit .spr svg{width:40px;height:auto}
      .err-bit-say{font-size:20px}
      .err-bit-op button{flex:1 1 100%;text-align:left}
    }
    @media (prefers-reduced-motion:reduce){.cur,.err-bit .spr,.glitch,.crt .roll{animation:none}}
  </style>
</head>
<body>
<main class="err">
  <pre class="err-txt" aria-live="polite"></pre>
  <div class="err-op" hidden>
    <button type="button" data-op="a"><u>A</u><span>bortar</span></button>
    <button type="button" data-op="r"><u>R</u><span>eintentar</span></button>
    <button type="button" data-op="i"><u>I</u><span>gnorar</span></button>
  </div>
  <p class="err-ayuda" hidden></p>
  <div class="err-bit" hidden><span class="spr" aria-hidden="true"></span><p class="err-bit-say"></p><div class="err-bit-op"></div></div>
  <nav class="err-dir" hidden aria-label="Secciones del portafolio"></nav>
</main>

<div id="apagado" hidden aria-hidden="true"><div class="ap-h ap-t"></div><div class="ap-h ap-b"></div><div class="ap-ln"></div></div>
<div class="crt" aria-hidden="true"><div class="scan"></div><div class="roll"></div><div class="vig"></div></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SND = () => window.Sonidos || { play() {} };
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  let en = false;
  try { en = localStorage.getItem("idioma") === "en"; } catch (e) { /* español */ }
  const T = (es, ingles) => (en ? ingles : es);
  if (en) {
    document.documentElement.lang = "en";
    document.title = "404 · Leonel Almanza Portfolio";
    $(".err-op [data-op='a'] span").textContent = "bort";
    $(".err-op [data-op='r'] span").textContent = "etry";
    $(".err-op [data-op='i'] span").textContent = "gnore";
  }

  /* ---------- ¿Dónde está el portafolio? ----------
     Sube carpeta por carpeta desde la dirección pedida hasta encontrar js/app.js.
     /Portafolio/algo-viejo → prueba /Portafolio/ y / → se queda con la que exista. */
  let raiz = "/";
  async function buscaRaiz() {
    if (location.protocol === "file:") return "./";
    const partes = location.pathname.split("/").slice(0, -1);
    const candidatos = [];
    for (let i = partes.length; i >= 1; i--) candidatos.push(partes.slice(0, i).join("/") + "/");
    const existe = async (c) => {
      try {
        let r = await fetch(c + "js/app.js", { method: "HEAD", cache: "no-store" });
        if (r.status === 405 || r.status === 501) r = await fetch(c + "js/app.js", { cache: "no-store" });
        // Si el servidor contesta todo con una página HTML, esa carpeta no cuenta
        return r.ok && !/html/i.test(r.headers.get("content-type") || "");
      } catch (e) { return false; }
    };
    const hay = await Promise.all(candidatos.map(existe));
    const i = hay.indexOf(true);
    return i >= 0 ? candidatos[i] : "/";
  }
  // Los sonidos del sitio, cargados desde la raíz que se encontró
  function cargaSonidos() {
    const b = document.createElement("base");
    b.href = raiz;
    document.head.prepend(b);
    const s = document.createElement("script");
    s.src = raiz + "js/sonidos.js";
    document.head.appendChild(s);
  }
  const irA = (seccion = "") => { location.href = raiz + seccion; };

  const txt = $(".err-txt"), op = $(".err-op"), ayuda = $(".err-ayuda");
  // La ruta que pidieron (sin la carpeta del sitio), con diagonales de DOS y siempre como texto
  function rutaPedida() {
    let r = location.pathname;
    try { r = decodeURIComponent(r); } catch (e) { /* se queda como venía */ }
    if (raiz.length > 1 && r.startsWith(raiz)) r = r.slice(raiz.length);
    return r.replace(/[^\w\-./]/g, "").replace(/^\/+|\/+$/g, "").replace(/\//g, "\\").slice(0, 40) || "?";
  }

  // Escribe un renglón letra por letra; cls = color (b blanco, r rojo, y amarillo, g gris)
  async function escribe(texto, cls = "", vel = 11) {
    const s = document.createElement("span");
    if (cls) s.className = cls;
    txt.appendChild(s);
    if (RM) { s.textContent = texto; return; }
    for (const ch of texto) { s.textContent += ch; if (ch !== " ") await espera(vel); }
  }
  let cursor = null, ocupado = true, intentos = 0, modoBit = false;
  // Teclas presionadas mientras se escribe: se atienden en orden (como el búfer de teclado de DOS)
  const enEspera = [];
  function prompt() {
    cursor = document.createElement("span");
    cursor.className = "cur";
    txt.append(T("¿Abortar, Reintentar, Ignorar? ", "Abort, Retry, Ignore? "), cursor);
    op.hidden = false;
    ayuda.hidden = false;
    ayuda.textContent = T("Presiona A, R o I", "Press A, R or I");
    ocupado = false;
    if (enEspera.length) { const k = enEspera.shift(); setTimeout(() => elige(k), RM ? 0 : 250); }
  }
  function quitaPrompt() {
    op.hidden = true;
    ayuda.hidden = true;
    if (cursor) { cursor.remove(); cursor = null; }
    txt.appendChild(document.createTextNode("\n"));
  }
  async function barra(hasta) {
    const s = document.createElement("span");
    s.className = "y";
    txt.appendChild(s);
    const N = innerWidth < 600 ? 10 : 20;
    for (let p = 0; p <= hasta; p += 5) {
      const k = Math.round((p / 100) * N);
      s.textContent = `[${"#".repeat(k)}${".".repeat(N - k)}] ${String(p).padStart(3)}%`;
      if (!RM) await espera(p > hasta - 15 && hasta < 100 ? 260 : 45);
    }
    txt.appendChild(document.createTextNode("\n"));
  }

  async function arranca() {
    raiz = await buscaRaiz();
    cargaSonidos();
    const ruta = rutaPedida();
    await escribe(`C:\\> cd \\${ruta.toLowerCase()}\n`, "b", 28);
    await espera(RM ? 0 : 350);
    await escribe(T("Error de lectura en la unidad C:\n", "Read error on drive C:\n"), "r");
    await escribe(T(`No se encontró la ruta C:\\${ruta.toUpperCase()}\n\n`, `Path not found: C:\\${ruta.toUpperCase()}\n\n`));
    prompt();
  }

  // A: se apaga la pantalla y te regresa al inicio
  async function abortar() {
    await escribe(T("Abortando...\n", "Aborting...\n"), "g");
    SND().play("exit");
    const ap = $("#apagado");
    ap.hidden = false;
    void ap.offsetWidth;
    ap.classList.add("off");
    await espera(RM ? 100 : 1300);
    irA();
  }
  // R: vuelve a intentar; a la tercera llega BIT
  async function reintentar() {
    intentos++;
    if (intentos === 1) {
      await escribe(T("Reintentando lectura... ", "Retrying read... "));
      await barra(100);
      await escribe(T("Error de lectura en la unidad C: (intento 2 de 3)\n\n", "Read error on drive C: (attempt 2 of 3)\n\n"), "r");
      prompt();
    } else if (intentos === 2) {
      await escribe(T("Reintentando... ", "Retrying... "));
      await barra(60);
      await escribe(T("El sector sigue igual de vacío. (intento 3 de 3)\n\n", "The sector is still just as empty. (attempt 3 of 3)\n\n"), "r");
      prompt();
    } else {
      await escribe(T("Último intento... llamando a BIT.\n", "Last try... calling BIT.\n"), "y");
      await espera(RM ? 0 : 500);
      llegaBit();
    }
  }
  function llegaBit() {
    const caja = $(".err-bit");
    caja.querySelector(".spr").innerHTML = svg(BIT, 6);
    caja.querySelector(".err-bit-say").textContent = T("Busqué sector por sector: esta página no existe. ¿Te llevo a casa?", "I searched sector by sector: this page doesn't exist. Want me to take you home?");
    const ops = caja.querySelector(".err-bit-op");
    ops.innerHTML = "";
    const si = document.createElement("button");
    si.type = "button";
    // Sin acentos: la fuente pixel no tiene mayúsculas acentuadas (como los sistemas de antes)
    si.textContent = T("[S] SI, LLEVAME", "[Y] YES, TAKE ME");
    si.addEventListener("click", () => irA());
    const dir = document.createElement("button");
    dir.type = "button";
    dir.textContent = T("[D] VER EL DIRECTORIO", "[D] SHOW DIRECTORY");
    dir.addEventListener("click", () => { caja.hidden = true; modoBit = false; directorio(true); });
    ops.append(si, dir);
    caja.hidden = false;
    SND().play("bit");
    si.focus();
    modoBit = true;
    ocupado = false;
  }
  // I: ignora el error, la pantalla se corrompe y muestra lo que sí existe
  async function ignorar() {
    await escribe(T("Ignorando el error...\n", "Ignoring the error...\n"), "g");
    if (!RM) {
      const BASURA = "#%&@$*+=?!/<>{}[]|~^0123456789ABCDEF";
      document.body.classList.add("glitch");
      for (let k = 0; k < 9; k++) {
        let s = "";
        for (let i = 0; i < 14; i++) {
          for (let j = 0; j < 60; j++) s += Math.random() < 0.12 ? " " : BASURA[(Math.random() * BASURA.length) | 0];
          s += "\n";
        }
        txt.textContent = s;
        document.body.style.background = k % 2 ? "var(--negro-claro)" : "var(--p-negro)";
        await espera(70);
      }
      document.body.classList.remove("glitch");
      document.body.style.background = "";
    }
    txt.textContent = "";
    directorio();
  }
  async function directorio(desdeBit) {
    ocupado = true;
    await escribe(desdeBit ? T("\nBIT te deja el directorio:\n\n", "\nBIT left you the directory:\n\n") : T("Error ignorado. Cargando lo que sí existe...\n\n", "Error ignored. Loading what does exist...\n\n"), "g");
    await escribe(T(" Directorio de C:\\PORTAFOLIO\n", " Directory of C:\\PORTFOLIO\n"), "b");
    const nav = $(".err-dir");
    nav.hidden = false;
    const SECC = [["", T("INICIO", "HOME")], ["#sobre-mi", T("PERFIL", "PROFILE")], ["#proyectos", T("PROYECTOS", "PROJECTS")], ["#habilidades", T("HABILIDADES", "SKILLS")], ["#contacto", T("CONTACTO", "CONTACT")]];
    for (const [seccion, nombre] of SECC) {
      const a = document.createElement("a");
      a.href = raiz + seccion;
      a.innerHTML = `<b></b><span>&lt;DIR&gt;</span>`;
      a.querySelector("b").textContent = nombre;
      nav.appendChild(a);
      if (!RM) await espera(90);
    }
    const pie = document.createElement("p");
    pie.textContent = T("        5 dir(s)     0 bytes perdidos", "        5 dir(s)     0 bytes lost");
    nav.appendChild(pie);
    nav.querySelector("a").focus();
  }

  function elige(k) {
    if (modoBit) {
      if (k === "s" || k === "y") irA();
      else if (k === "d") { modoBit = false; $(".err-bit").hidden = true; directorio(true); }
      return;
    }
    if (!"ari".includes(k)) return;
    if (ocupado) { if (enEspera.length < 3) enEspera.push(k); return; }
    ocupado = true;
    quitaPrompt();
    if (k === "a") abortar();
    else if (k === "r") reintentar();
    else ignorar();
  }
  op.addEventListener("click", (e) => { const b = e.target.closest("button[data-op]"); if (b) elige(b.dataset.op); });
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    elige(e.key.toLowerCase());
  });

  // BIT, con el mismo dibujo del sitio (sonriendo)
  const BIT = [".YYYYYYYY.", "YYYYYYYYYY", "YYYYYYYYYY", "YYWKYYWKYY", "YYKKYYKKYY", "YYYYYYYYYY", "YYYKYYKYYY", "YYYYKKYYYY", "QYYYYYYYYQ", ".QQQQQQQQ.", "..QQ..QQ..", ".QQQ..QQQ."];
  function svg(rows, px) {
    const h = rows.length, w = rows[0].length;
    let out = "";
    rows.forEach((row, y) => {
      for (let x = 0; x < w;) {
        const c = row[x];
        if (c === ".") { x++; continue; }
        let n = 1;
        while (row[x + n] === c) n++;
        out += `<rect class="p${c}" x="${x}" y="${y}" width="${n}" height="1"/>`;
        x += n;
      }
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="${w * px}" height="${h * px}" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${out}</svg>`;
  }

  arranca();
})();
</script>
</body>
</html>
